# Rule file for this repository. It also serves as the CI smoke-test fixture
# and a live example of the format documented in README.md. This repository has
# no sketch/ directory, so the rule matches nothing and the smoke test's
# dry run always reports zero candidates.
rules:
  - match:
      manifest_path: "sketch/**"
    classification: general
    reason: tolerable_risk
    comment: Dependencies under sketch/ are not used in production.
