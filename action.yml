name: Dependabot Alert Triage
description: Dismiss Dependabot alerts that match rules in your workflow or repository
author: pokutuna

inputs:
  token:
    description: Token used to read and update Dependabot alerts
    required: true
  dry_run:
    description: Only report matching alerts without dismissing them
    required: false
    default: "false"
  config:
    description: Path to the rule file; defaults to .github/dependabot-triage.yml
    required: false
  rules:
    description: Rules as an inline YAML array; cannot be combined with config
    required: false
  max_alerts:
    description: Maximum number of open alerts to read from the API in one run
    required: false
    default: "1000"

outputs:
  candidates_count:
    description: Number of open alerts that matched a rule
  dismissed_count:
    description: Number of alerts that were dismissed

runs:
  using: node24
  main: dist/index.js
